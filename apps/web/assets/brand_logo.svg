<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <!-- Brand Gradient: blue-600 (#2563eb) to emerald-500 (#10b981) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Content Group (Perfect vertical alignment) -->
  <g transform="translate(60, 50)">
    <!-- Brand Logo -->
    <image href="logo.png" x="0" y="0" width="100" height="100" />
    
    <!-- Text Group (Vertically centered relative to the 100px logo) -->
    <g transform="translate(125, 0)">
      <!-- Brand Name "Tezra" with gradient fill -->
      <text x="0" y="60" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="url(#brandGrad)" letter-spacing="-1">Tezra</text>
      <!-- Tagline below -->
      <text x="3" y="90" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#64748b" letter-spacing="0.2">Microwork for Stablecoins</text>
    </g>
  </g>
</svg>
