<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Content Group -->
  <g transform="translate(60, 45)">
    <!-- Brand Logo (references the actual logo.png relatively) -->
    <image href="logo.png" x="0" y="10" width="90" height="90" />
    
    <!-- Brand Name "Tezra" -->
    <text x="115" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#0f172a">Tezra</text>
    
    <!-- Tagline -->
    <text x="118" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#64748b" letter-spacing="0.5">Microwork for Stablecoins</text>
  </g>
</svg>
